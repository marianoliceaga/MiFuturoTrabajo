<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Futuro Trabajo</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="MiFuturoTrabajo.Client.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <!-- Google Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Microsoft MSAL.js -->
    <script src="https://alcdn.msauth.net/browser/2.30.0/js/msal-browser.min.js"></script>

    <!-- OAuth Helper Scripts -->
    <script>
        // Set Google Callback Reference
        window.setGoogleCallback = function(dotnetHelper) {
            window.blazorGoogleCallback = dotnetHelper;
        };

        // Google Login Callback Handler
        window.handleGoogleCredentialResponse = function(response) {
            if (window.blazorGoogleCallback) {
                window.blazorGoogleCallback.invokeMethodAsync('HandleGoogleCredential', response.credential);
            }
        };

        // Initialize Google Identity Services once the library is ready
        function initGoogleSignIn() {
            if (window.google && window.google.accounts && window.google.accounts.id) {
                google.accounts.id.initialize({
                    client_id: GOOGLE_CLIENT_ID,
                    callback: window.handleGoogleCredentialResponse,
                    auto_select: false,
                    cancel_on_tap_outside: true
                });
                console.log('Google Sign-In initialized');
            }
        }

        // Try to init immediately; if the GSI script hasn't loaded yet, wait for it
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initGoogleSignIn);
        } else {
            initGoogleSignIn();
        }

        // Fallback: the GSI script is async, so retry after it loads
        window.addEventListener('load', initGoogleSignIn);

        /**
         * Primary entry point called from Blazor when the user clicks "Sign in with Google".
         * Strategy:
         *   1. Try One Tap prompt.
         *   2. If One Tap is suppressed/skipped, show a temporary overlay with the
         *      official Google Sign-In button and programmatically click it, which
         *      opens a reliable popup window.
         */
        window.signInWithGoogle = function () {
            if (!window.google || !window.google.accounts || !window.google.accounts.id) {
                console.error('Google Sign-In library not loaded yet');
                return;
            }

            // Re-initialize to make sure callback is fresh
            google.accounts.id.initialize({
                client_id: GOOGLE_CLIENT_ID,
                callback: window.handleGoogleCredentialResponse,
                auto_select: false,
                cancel_on_tap_outside: true
            });

            // Try One Tap first
            google.accounts.id.prompt(function (notification) {
                if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
                    // One Tap was suppressed — fall back to popup button
                    console.log('One Tap suppressed, falling back to popup button');
                    showGooglePopupFallback();
                }
            });
        };

        // Renders an official Google button into a temporary overlay and clicks it
        function showGooglePopupFallback() {
            // Remove any stale overlay first
            var existing = document.getElementById('google-signin-overlay');
            if (existing) { document.body.removeChild(existing); }

            // Create overlay
            var overlay = document.createElement('div');
            overlay.id = 'google-signin-overlay';
            overlay.style.cssText = [
                'position:fixed', 'inset:0', 'z-index:99999',
                'display:flex', 'align-items:center', 'justify-content:center',
                'background:rgba(0,0,0,0.5)'
            ].join(';');

            var card = document.createElement('div');
            card.style.cssText = 'background:#fff;border-radius:12px;padding:32px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.3)';

            var title = document.createElement('p');
            title.textContent = 'Click below to continue with Google';
            title.style.cssText = 'margin-bottom:16px;font-family:sans-serif;color:#444';

            var btnContainer = document.createElement('div');
            btnContainer.id = 'google-popup-btn';

            var cancelBtn = document.createElement('button');
            cancelBtn.textContent = 'Cancel';
            cancelBtn.style.cssText = 'margin-top:16px;padding:8px 20px;border:1px solid #ccc;border-radius:6px;background:#fff;cursor:pointer;font-family:sans-serif';
            cancelBtn.onclick = function () {
                var o = document.getElementById('google-signin-overlay');
                if (o) { document.body.removeChild(o); }
                // Notify Blazor that the user cancelled
                if (window.blazorGoogleCallback) {
                    window.blazorGoogleCallback.invokeMethodAsync('HandleGoogleCancelled');
                }
            };

            card.appendChild(title);
            card.appendChild(btnContainer);
            card.appendChild(cancelBtn);
            overlay.appendChild(card);
            document.body.appendChild(overlay);

            // Render the official Google button and auto-click it
            google.accounts.id.renderButton(btnContainer, {
                type: 'standard',
                shape: 'rectangular',
                theme: 'outline',
                text: 'signin_with',
                size: 'large',
                logo_alignment: 'left'
            });

            // Auto-click the rendered button so the popup opens immediately
            setTimeout(function () {
                var gBtn = btnContainer.querySelector('div[role="button"]');
                if (gBtn) { gBtn.click(); }
            }, 150);
        }

        // Backward-compatible alias
        window.showGoogleOneTap = window.signInWithGoogle;

        // ── Microsoft MSAL ──────────────────────────────────────────────────────
        const msalConfig = {
            auth: {
                clientId: '017e3aea-92a7-4724-94ed-fae35fba5131',
                authority: 'https://login.microsoftonline.com/common',
                redirectUri: window.location.origin + '/login-callback'
            }
        };

        const msalInstance = new msal.PublicClientApplication(msalConfig);

        msalInstance.initialize().then(function () {
            console.log('MSAL initialized');
        });

        window.loginWithMicrosoft = async function () {
            try {
                const loginResponse = await msalInstance.loginPopup({
                    scopes: ['openid', 'profile', 'email', 'User.Read']
                });
                return loginResponse.idToken;
            } catch (error) {
                console.error('Microsoft login error:', error);
                throw error;
            }
        };
    </script>

    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
