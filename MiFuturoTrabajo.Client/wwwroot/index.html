<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Futuro Trabajo</title>
    <base href="/" />
    <!-- Resolves theme and language before the first paint. Must stay blocking
         and must stay above the stylesheets. -->
    <script src="js/preferences.js"></script>
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="MiFuturoTrabajo.Client.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <!-- The message and reload label are localised by js/preferences.js;
         the text here is the pre-script fallback. -->
    <div id="blazor-error-ui">
        <span class="message">Se produjo un error inesperado.</span>
        <a href="." class="reload">Recargar</a>
        <span class="dismiss">🗙</span>
    </div>

    <!-- Google Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Microsoft MSAL.js -->
    <script src="https://alcdn.msauth.net/browser/2.30.0/js/msal-browser.min.js"></script>

    <!-- OAuth Helper Scripts -->
    <script>
        // ── OAuth configuration ─────────────────────────────────────────────────
        //
        // Client IDs used to be literals in this file - and GOOGLE_CLIENT_ID was
        // referenced twice while never being assigned anywhere, so Google
        // initialisation threw a ReferenceError and sign-in could not work at
        // all. They now come from wwwroot/appsettings.json, the same file the
        // Blazor app reads, so localhost and the deployed site can differ
        // without editing markup.
        //
        // These identifiers are public by design: a client ID is not a secret,
        // it is half of a pair whose other half never leaves Google or Entra.
        // What actually protects the account is the redirect-URI allowlist in
        // the provider console, plus the signature check on the API side.
        window.oauthConfigReady = (async function () {
            try {
                const response = await fetch('appsettings.json', { cache: 'no-cache' });
                const settings = response.ok ? await response.json() : {};
                const oauth = settings.OAuth || {};

                window.oauthConfig = {
                    googleClientId: (oauth.Google || {}).ClientId || '',
                    microsoftClientId: (oauth.Microsoft || {}).ClientId || '',
                    microsoftAuthority: (oauth.Microsoft || {}).Authority
                        || 'https://login.microsoftonline.com/common'
                };
            } catch (e) {
                console.error('Could not read OAuth configuration', e);
                window.oauthConfig = { googleClientId: '', microsoftClientId: '', microsoftAuthority: '' };
            }

            return window.oauthConfig;
        })();

        // Set Google Callback Reference
        window.setGoogleCallback = function(dotnetHelper) {
            window.blazorGoogleCallback = dotnetHelper;
        };

        // Google Login Callback Handler
        window.handleGoogleCredentialResponse = function(response) {
            if (window.blazorGoogleCallback) {
                window.blazorGoogleCallback.invokeMethodAsync('HandleGoogleCredential', response.credential);
            }
        };

        // Initialize Google Identity Services once the library and the
        // configuration are both ready.
        async function initGoogleSignIn() {
            const config = await window.oauthConfigReady;

            if (!config.googleClientId) {
                console.warn('Google sign-in is not configured (OAuth:Google:ClientId is empty)');
                return;
            }

            if (window.google && window.google.accounts && window.google.accounts.id) {
                google.accounts.id.initialize({
                    client_id: config.googleClientId,
                    callback: window.handleGoogleCredentialResponse,
                    auto_select: false,
                    cancel_on_tap_outside: true
                });
                console.log('Google Sign-In initialized');
            }
        }

        // Try to init immediately; if the GSI script hasn't loaded yet, wait for it
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initGoogleSignIn);
        } else {
            initGoogleSignIn();
        }

        // Fallback: the GSI script is async, so retry after it loads
        window.addEventListener('load', initGoogleSignIn);

        /**
         * Primary entry point called from Blazor when the user clicks "Sign in with Google".
         * Strategy:
         *   1. Try One Tap prompt.
         *   2. If One Tap is suppressed/skipped, show a temporary overlay with the
         *      official Google Sign-In button and programmatically click it, which
         *      opens a reliable popup window.
         */
        window.signInWithGoogle = async function () {
            if (!window.google || !window.google.accounts || !window.google.accounts.id) {
                console.error('Google Sign-In library not loaded yet');
                return;
            }

            const config = await window.oauthConfigReady;

            if (!config.googleClientId) {
                console.error('Google sign-in is not configured (OAuth:Google:ClientId is empty)');
                return;
            }

            // Re-initialize to make sure callback is fresh
            google.accounts.id.initialize({
                client_id: config.googleClientId,
                callback: window.handleGoogleCredentialResponse,
                auto_select: false,
                cancel_on_tap_outside: true
            });

            // Try One Tap first
            google.accounts.id.prompt(function (notification) {
                if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
                    // One Tap was suppressed — fall back to popup button
                    console.log('One Tap suppressed, falling back to popup button');
                    showGooglePopupFallback();
                }
            });
        };

        // Renders an official Google button into a temporary overlay and clicks it
        function showGooglePopupFallback() {
            // Remove any stale overlay first
            var existing = document.getElementById('google-signin-overlay');
            if (existing) { document.body.removeChild(existing); }

            // Create overlay
            var overlay = document.createElement('div');
            overlay.id = 'google-signin-overlay';
            overlay.style.cssText = [
                'position:fixed', 'inset:0', 'z-index:99999',
                'display:flex', 'align-items:center', 'justify-content:center',
                'background:rgba(0,0,0,0.5)'
            ].join(';');

            var card = document.createElement('div');
            card.style.cssText = 'background:#fff;border-radius:12px;padding:32px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.3)';

            var title = document.createElement('p');
            title.textContent = 'Click below to continue with Google';
            title.style.cssText = 'margin-bottom:16px;font-family:sans-serif;color:#444';

            var btnContainer = document.createElement('div');
            btnContainer.id = 'google-popup-btn';

            var cancelBtn = document.createElement('button');
            cancelBtn.textContent = 'Cancel';
            cancelBtn.style.cssText = 'margin-top:16px;padding:8px 20px;border:1px solid #ccc;border-radius:6px;background:#fff;cursor:pointer;font-family:sans-serif';
            cancelBtn.onclick = function () {
                var o = document.getElementById('google-signin-overlay');
                if (o) { document.body.removeChild(o); }
                // Notify Blazor that the user cancelled
                if (window.blazorGoogleCallback) {
                    window.blazorGoogleCallback.invokeMethodAsync('HandleGoogleCancelled');
                }
            };

            card.appendChild(title);
            card.appendChild(btnContainer);
            card.appendChild(cancelBtn);
            overlay.appendChild(card);
            document.body.appendChild(overlay);

            // Render the official Google button and auto-click it
            google.accounts.id.renderButton(btnContainer, {
                type: 'standard',
                shape: 'rectangular',
                theme: 'outline',
                text: 'signin_with',
                size: 'large',
                logo_alignment: 'left'
            });

            // Auto-click the rendered button so the popup opens immediately
            setTimeout(function () {
                var gBtn = btnContainer.querySelector('div[role="button"]');
                if (gBtn) { gBtn.click(); }
            }, 150);
        }

        // Backward-compatible alias
        window.showGoogleOneTap = window.signInWithGoogle;

        // ── Microsoft MSAL ──────────────────────────────────────────────────────
        // MSAL is configured from the same appsettings.json, so the deployed
        // origin and localhost differ by configuration rather than by an edit
        // to this file. Both must be registered as redirect URIs in the Entra
        // app registration - that allowlist, not the client ID, is what stops
        // another site from using this registration.
        const msalReady = window.oauthConfigReady.then(function (config) {
            const msalConfig = {
                auth: {
                    clientId: config.microsoftClientId,
                    authority: config.microsoftAuthority,
                    redirectUri: window.location.origin + '/login-callback'
                }
            };

            if (!msalConfig.auth.clientId) {
                console.warn('Microsoft sign-in is not configured (OAuth:Microsoft:ClientId is empty)');
                return null;
            }

            return new msal.PublicClientApplication(msalConfig);
        });

        // Initialisation is a promise now rather than a top-level const, so
        // callers await it instead of assuming a ready instance is in scope.
        const msalInitialized = msalReady.then(function (instance) {
            if (!instance) { return null; }

            return instance.initialize().then(function () {
                console.log('MSAL initialized');
                return instance;
            });
        });

        window.loginWithMicrosoft = async function () {
            const msalInstance = await msalInitialized;

            if (!msalInstance) {
                throw new Error('Microsoft sign-in is not configured.');
            }

            try {
                const loginResponse = await msalInstance.loginPopup({
                    scopes: ['openid', 'profile', 'email', 'User.Read']
                });
                return loginResponse.idToken;
            } catch (error) {
                console.error('Microsoft login error:', error);
                throw error;
            }
        };
    </script>

    <!-- Started by hand so the culture is known before the runtime boots.
         applicationCulture is what makes Blazor fetch the matching satellite
         assembly (es/MiFuturoTrabajo.Client.resources.dll); setting the culture
         later from C# would change CultureInfo without ever downloading the
         translations, and every string would silently fall back to English. -->
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        Blazor.start({
            applicationCulture: window.mftPrefs ? window.mftPrefs.getCulture() : 'es'
        });
    </script>
</body>

</html>
