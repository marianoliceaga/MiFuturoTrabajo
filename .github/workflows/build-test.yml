name: Build and test

# Runs on everything. A green tick on a pull request is only worth something if
# the same job also guards the branch it merges into.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Called by deploy.yml, so a deployment cannot skip the gate.
  workflow_call:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore MiFuturoTrabajo.sln

      # Warnings-as-errors is deliberate. Phase 1 cleared 116 warnings; without
      # a gate they come back one pull request at a time.
      - name: Build
        run: dotnet build MiFuturoTrabajo.sln -c Release --no-restore -warnaserror

      # The suite is self-contained: an InMemory store, a fake blob service and
      # a capturing mail service, so there is nothing to provision here and no
      # secret to leak into a fork's CI.
      - name: Test
        run: >
          dotnet test MiFuturoTrabajo.sln -c Release --no-build
          --logger "trx;LogFileName=results.trx"
          --results-directory TestResults

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          retention-days: 7

  # Infrastructure is code, so it gets compiled like code. Catching a malformed
  # template here costs seconds; catching it during a deployment costs a
  # half-created resource group.
  validate-infra:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Bicep
        run: az bicep build --file infra/main.bicep --stdout > /dev/null
