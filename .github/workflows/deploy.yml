name: Deploy

# Only from main, and only after the tests that guard main have passed.
# workflow_dispatch is kept so a deploy can be re-run without an empty commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # OIDC federated credentials rather than a stored publish profile or a
  # long-lived service principal secret: nothing here is a credential that could
  # leak from the repository.
  id-token: write
  contents: read

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  # Deploying a broken build is worse than not deploying, so the same gate runs
  # first rather than being assumed from the push event.
  build-test:
    uses: ./.github/workflows/build-test.yml

  deploy:
    needs: build-test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ------------------------------------------------------------------
      # API
      # ------------------------------------------------------------------

      - name: Publish API
        run: dotnet publish MiFuturoTrabajo.Api/MiFuturoTrabajo.Api.csproj -c Release -o publish/api

      - name: Deploy API
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.API_APP_NAME }}
          package: publish/api

      # ------------------------------------------------------------------
      # Reminder functions
      # ------------------------------------------------------------------

      - name: Publish Functions
        run: dotnet publish MiFuturoTrabajo.Functions/MiFuturoTrabajo.Functions.csproj -c Release -o publish/functions

      - name: Deploy Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.FUNCTIONS_APP_NAME }}
          package: publish/functions

      # ------------------------------------------------------------------
      # Blazor client
      # ------------------------------------------------------------------

      # The client reads wwwroot/appsettings.json at runtime for ApiBaseUrl and
      # the public OAuth client IDs. It is written here rather than committed
      # with a hostname in it, so the same source deploys to any environment.
      - name: Write client configuration
        run: |
          cat > MiFuturoTrabajo.Client/wwwroot/appsettings.json <<JSON
          {
            "ApiBaseUrl": "${{ vars.API_BASE_URL }}",
            "OAuth": {
              "Google": {
                "ClientId": "${{ vars.GOOGLE_CLIENT_ID }}"
              },
              "Microsoft": {
                "ClientId": "${{ vars.MICROSOFT_CLIENT_ID }}",
                "Authority": "https://login.microsoftonline.com/common"
              }
            }
          }
          JSON
          cat MiFuturoTrabajo.Client/wwwroot/appsettings.json

      - name: Publish client
        run: dotnet publish MiFuturoTrabajo.Client/MiFuturoTrabajo.Client.csproj -c Release -o publish/client

      - name: Deploy client
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: publish/client/wwwroot
          skip_app_build: true

      # ------------------------------------------------------------------
      # Prove it actually came up
      # ------------------------------------------------------------------

      # A deploy that reports success while the site returns 500 is worse than a
      # failed one, because nobody looks. On F1 the first request also has to
      # wake the site, hence the retries.
      # A deploy that reports success while the site is broken is worse than a
      # failed one, because nobody looks. This probes what actually broke
      # before rather than only what is easy to check:
      #
      #   - the API answers at all (retried: F1 has no Always On, so the first
      #     request after a deploy has to wake the site)
      #   - a client DEEP LINK returns 200, not just the root. Blazor routes on
      #     the client, so without navigationFallback every refresh and every
      #     shared link 404s while the landing page looks perfectly fine. That
      #     shipped once, and the old smoke test passed anyway because it only
      #     checked the API.
      #   - appsettings.json is still served as JSON. If the fallback ever
      #     rewrites it, the client parses index.html as its configuration and
      #     loses its API URL - a silent breakage, which is worse than a 404.
      #   - a missing asset still 404s, proving the fallback is not swallowing
      #     everything and turning absent files into fake successes.
      - name: Smoke test
        run: |
          api="${{ vars.API_BASE_URL }}"
          api="${api%/api/}"
          client="${{ vars.CLIENT_BASE_URL }}"
          client="${client%/}"

          failed=0

          check() {
            local label="$1" url="$2" want_code="$3" want_type="$4"
            local out code type
            out=$(curl -s -o /dev/null -w '%{http_code} %{content_type}' --max-time 30 "$url" || echo "000 none")
            code="${out%% *}"
            type="${out#* }"

            if [ "$code" != "$want_code" ]; then
              echo "  FAIL  $label -> $code (wanted $want_code)  $url"
              failed=1
              return
            fi

            if [ -n "$want_type" ]; then
              case "$type" in
                *"$want_type"*) ;;
                *)
                  echo "  FAIL  $label -> content-type '$type' (wanted $want_type)  $url"
                  failed=1
                  return
                  ;;
              esac
            fi

            echo "  ok    $label -> $code${want_type:+ $type}"
          }

          echo "API, with retries for the F1 cold start:"
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$api/health" || echo 000)
            echo "  attempt $attempt: $code"
            [ "$code" = "200" ] && break
            [ "$attempt" = "6" ] && { echo "  FAIL  API never became healthy"; failed=1; }
            sleep 15
          done

          echo "Client:"
          check "root"              "$client/"                   200 "text/html"
          check "deep link /board"  "$client/board"              200 "text/html"
          check "deep link /tasks"  "$client/tasks"              200 "text/html"
          check "runtime config"    "$client/appsettings.json"   200 "application/json"
          check "missing asset"     "$client/no-such-file.png"   404 ""

          [ "$failed" = "0" ] || { echo; echo "Smoke test failed."; exit 1; }
          echo
          echo "Smoke test passed."
